<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏模板</title>
</head>
<body>
    <!-- 市营电车站弹窗模板 -->
    <div id="station-dialog-template" style="display: none;">
        <div class="station-dialog-content">
            <div class="station-dialog-header">
                <h3>是否搭上电车？</h3>
                <p>使用"钱"道具卡可以传送到其他车站，不消耗行动点</p>
            </div>
            <div class="map-grid-container">
                <div class="map-grid" id="station-map">
                </div>
            </div>
            <div class="station-dialog-footer">
                <button class="cancel-station">取消</button>
            </div>
        </div>
    </div>

    <!-- 水道桥/吾妻桥弹窗模板 -->
    <div id="waterway-dialog-template" style="display: none;">
        <div class="station-dialog-content">
            <div class="station-dialog-header">
                <h3>是否要丢弃道具？</h3>
                <p>可以丢弃手里不需要的任意道具卡，不消耗行动点</p>
            </div>
            <div class="item-list" id="waterway-item-list">
            </div>
            <div class="station-dialog-footer">
                <button class="cancel-waterway">取消</button>
            </div>
        </div>
    </div>

    <!-- 地图选择弹窗模板 -->
    <div id="map-selection-dialog-template" style="display: none;">
        <div class="map-selection-content">
            <div class="map-selection-header">
                <h3>选择要移动到的{{locationName}}地块：</h3>
            </div>
            <div class="map-grid-container">
                <div class="map-grid" id="selection-map">
                </div>
            </div>
            <div class="map-selection-footer">
                <button class="cancel-map-selection">取消</button>
            </div>
        </div>
    </div>

    <!-- 胜利弹窗模板 -->
    <div id="win-dialog-template" style="display: none;">
        <div class="win-dialog-content">
            <h2>游戏胜利！</h2>
            <p>胜利者是：<span id="winner-name"></span></p>
            <button class="close-win-dialog">关闭</button>
        </div>
    </div>

    <!-- 脑髓地狱弹窗模板 -->
    <div id="brain-hell-dialog-template" style="display: none;">
        <div class="brain-hell-content">
            <h3>选择要降低好感度的角色</h3>
            <div class="player-list" id="brain-hell-player-list">
            </div>
            <div class="dialog-footer">
                <button class="cancel-button">取消</button>
            </div>
        </div>
    </div>

    <!-- 咖啡厅弹窗模板 -->
    <div id="coffee-shop-dialog-template" style="display: none;">
        <div class="station-dialog-content">
            <div class="station-dialog-header">
                <h3>选择要置换的道具</h3>
                <p>使用"钱"道具卡可以置换道具，不消耗行动点</p>
            </div>
            <div class="coffee-shop-options">
                <div class="coffee-shop-option" data-item="可尔思必">可尔思必</div>
                <div class="coffee-shop-option" data-item="咖啡">咖啡</div>
                <div class="coffee-shop-option" data-item="蛋包饭">蛋包饭</div>
            </div>
            <div class="station-dialog-footer">
                <button class="cancel-coffee-shop">取消</button>
            </div>
        </div>
    </div>

    <!-- 帝国大学弹窗模板 -->
    <div id="university-dialog-template" style="display: none;">
        <div class="dialog-content">
            <h3>帝国大学</h3>
            <p>你在帝国大学进行了一次掷骰子，结果是：<strong>{{diceRoll}}</strong></p>
            <div id="dice-result-text">{{message}}</div>
            <button class="ok-button">确定</button>
        </div>
    </div>

    <!-- 帕诺拉马岛弹窗模板 -->
    <div id="panorama-dialog-template" style="display: none;">
        <div class="exchange-items-dialog-content">
            <h3>帕诺拉马岛 - 交换道具</h3>
            <div class="exchange-content">
                <div class="exchange-step-indicator">步骤 1/3：选择第一位玩家</div>
                <div class="exchange-players-list" id="panorama-player-list">
                </div>
            </div>
            <div class="exchange-buttons">
                <button class="confirm-button" data-action="confirm" disabled>确认交换</button>
                <button class="cancel-button">取消</button>
            </div>
        </div>
    </div>

    <!-- 电光艇弹窗模板 -->
    <div id="lightning-boat-dialog-template" style="display: none;">
        <div class="lightning-boat-dialog-content">
            <h3>电光艇 - 指定步数</h3>
            <div class="lightning-boat-content">
                <div class="lightning-boat-step">选择要移动的步数（1-6）：</div>
                <select id="lightning-boat-steps" class="lightning-boat-select">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                </select>
                <div class="lightning-boat-info" id="lightning-boat-info">
                    即将移动 <span class="steps-value">1</span> * 2 = <span class="total-steps">2</span> 格
                </div>
            </div>
            <div class="lightning-boat-buttons">
                <button class="confirm-button" data-action="confirm">确认移动</button>
                <button class="cancel-button">取消</button>
            </div>
        </div>
    </div>
</body>
</html>
